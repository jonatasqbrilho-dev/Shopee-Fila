<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopee-Fila</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#edf0ee}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="painel" src="/index.html"></iframe><script>
(function(){
 const f=document.getElementById('painel');
 const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const senha=()=>f.contentWindow?.localStorage?.senha||'';
 const run=()=>{try{
  const d=f.contentDocument;if(!d||!d.body)return;
  let style=d.getElementById('video-ui-style');
  if(!style){style=d.createElement('style');style.id='video-ui-style';style.textContent=`
   .video-box{margin-top:9px;border:1px solid #d3dbd7;border-radius:10px;padding:9px;background:var(--bg)}
   .video-result{display:grid;grid-template-columns:90px 1fr;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
   .video-result img{width:90px;height:90px;object-fit:cover;border-radius:7px}.video-score{font-weight:800}.video-small{font-size:12px;color:var(--mut);margin-top:3px}
   .publish-box{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
   .publish-title{font-weight:750;margin-bottom:6px}.publish-status{font-size:12px;color:var(--mut);margin-top:7px;white-space:pre-wrap}
   .produto-box{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
   .produto-modal{position:fixed;inset:0;background:#0008;z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px}
   .produto-modal-card{width:min(560px,96vw);max-height:90vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:14px;padding:16px;box-shadow:0 12px 40px #0005}
   .produto-modal input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
   .produto-preview{display:grid;grid-template-columns:84px 1fr;gap:10px;margin-top:10px;padding:9px;border:1px solid var(--line);border-radius:9px}.produto-preview img{width:84px;height:84px;object-fit:cover;border-radius:8px}
   .produto-link-row{display:flex;gap:7px;align-items:center;margin-top:7px}.produto-link-row input{flex:1;min-width:0}.produto-link-row a{white-space:nowrap}
  `;d.head.appendChild(style)}

  /* Botão Adicionar produto ao lado de Coletar agora */
  const coletar=d.getElementById('coletar');
  if(coletar&&!d.getElementById('adicionar-produto-btn')){
   const b=d.createElement('button');b.id='adicionar-produto-btn';b.className='pri';b.type='button';b.textContent='➕ Adicionar produto';coletar.parentNode.insertBefore(b,coletar.nextSibling);
   b.onclick=()=>abrirAdicionar(d);
  }

  /* Caixa de links Shopee/TikTok dentro de cada produto */
  d.querySelectorAll('.card').forEach(card=>{
   const full=card.querySelector('.full');if(!full)return;const id=card.dataset.id;if(!id)return;
   if(!card.querySelector('[data-cross-links]')){
    const box=d.createElement('div');box.className='produto-box';box.dataset.crossLinks='1';box.innerHTML='<b>🔗 Links do produto</b><div class="video-small">Carregando links…</div>';
    const before=full.querySelector('.row');if(before)full.insertBefore(box,before);else full.appendChild(box);
    const loadLinks=async()=>{try{const r=await fetch('/.netlify/functions/fila?status='+encodeURIComponent(card.closest('#lista')?.dataset?.status||'pendente'),{headers:{'x-senha':senha()}});if(!r.ok)return;const arr=await r.json();const p=arr.find(x=>String(x.id)===String(id));if(!p)return;const l=p.links_plataforma||{};box.innerHTML='<b>🔗 Links do produto</b>'+linkRow('TikTok Shop',l.tiktok,d,'tiktok',id)+linkRow('Shopee',l.shopee||p.link_produto,d,'shopee',id);box.innerHTML+='<div class="row" style="margin-top:7px"><button type="button" data-add-link>➕ Adicionar/vincular link</button></div>';box.querySelector('[data-add-link]').onclick=()=>abrirVinculo(d,id);box.querySelectorAll('[data-open-link]').forEach(a=>a.onclick=()=>window.open(a.dataset.openLink,'_blank','noopener,noreferrer'));}catch{}}
    loadLinks();
   }

   const existing=card.querySelector('[data-publish-box]');if(existing)return;
   const row=full.querySelector('.row');
   if(row&&!card.querySelector('[data-video-search]')){const b=d.createElement('button');b.type='button';b.textContent='🎬 Buscar vídeo';b.className='pri';b.dataset.videoSearch='1';row.insertBefore(b,row.firstChild);const box=d.createElement('div');box.className='video-box';box.hidden=true;box.innerHTML='<b>🎬 Vídeos encontrados</b><div class="video-list video-small">Clique em Buscar vídeo para pesquisar no Telegram.</div>';full.appendChild(box);b.onclick=async()=>{b.disabled=true;box.hidden=false;const list=box.querySelector('.video-list');list.textContent='Pesquisando vídeos no Telegram e analisando thumbnails…';try{const r=await fetch('/.netlify/functions/video-busca',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({acao:'buscar',produto_id:id,max_messages:80})});const j=await r.json();if(!j.ok)throw Error(j.erro||'Erro na busca');if(!j.resultados?.length){list.textContent='Nenhum vídeo encontrado.';return}list.innerHTML=j.resultados.map(x=>'<div class="video-result"><div>'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'">':'<div class="video-small">Sem thumbnail</div>')+'</div><div><div class="video-score">'+Number(x.match_score||0)+'% de correspondência</div><div class="video-small">'+esc(x.match_reason||'Sem justificativa')+'</div><div class="video-small">'+esc(x.telegram_caption||'Sem legenda')+'</div><div style="margin-top:6px"><a href="'+esc(x.telegram_message_url||'#')+'" target="_blank" rel="noopener" class="btn">▶ Telegram</a> <button type="button" data-use-video="'+x.telegram_message_id+'" data-score="'+(x.match_score||0)+'">✅ Usar</button></div></div></div>').join('');list.querySelectorAll('[data-use-video]').forEach(u=>u.onclick=async()=>{u.disabled=true;u.textContent='Salvando…';try{const rr=await fetch('/.netlify/functions/video-busca',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({acao:'usar',produto_id:id,message_id:u.dataset.useVideo,score:u.dataset.score})});const jj=await rr.json();if(!jj.ok)throw Error(jj.erro||'Não foi possível salvar');u.textContent='✅ Salvo';}catch(e){u.disabled=false;u.textContent='✅ Usar';alert(e.message)}})}catch(e){list.textContent='Erro: '+e.message}finally{b.disabled=false}}}
   const box=d.createElement('div');box.className='publish-box';box.dataset.publishBox='1';box.hidden=true;box.innerHTML=`<div class="publish-title">📤 Publicar este vídeo</div><div class="row" style="margin-top:4px"><button type="button" data-publish="telegram" class="ok">📲 Enviar para Telegram</button><button type="button" data-publish="tiktok" class="pri">🎵 Enviar para TikTok</button><button type="button" data-connect-tiktok>🔗 Conectar TikTok</button></div><div class="row"><label>Privacidade TikTok <select data-tt-privacy style="font:inherit;padding:6px;border:1px solid var(--line);border-radius:7px"><option value="PUBLIC_TO_EVERYONE">Público</option><option value="SELF_ONLY">Somente eu</option><option value="MUTUAL_FOLLOW_FRIENDS">Amigos</option><option value="FOLLOWER_OF_CREATOR">Seguidores</option></select></label><label><input type="checkbox" data-tt-aigc checked> Vídeo gerado por IA</label></div><div class="publish-status" data-publish-status></div>`;
   full.appendChild(box);
   const getVideo=()=>card.dataset.video||full.querySelector('a[download][href]')?.href||'';
   const sync=()=>{const v=getVideo();box.hidden=!v;return v};sync();
   const status=msg=>{box.querySelector('[data-publish-status]').textContent=msg};
   box.querySelector('[data-connect-tiktok]').onclick=()=>{window.open('/.netlify/functions/publicar?oauth=start','_blank','noopener,noreferrer');status('Abrindo autorização do TikTok…')};
   box.querySelectorAll('[data-publish]').forEach(btn=>btn.onclick=async()=>{const video=sync();if(!video){status('Anexe o vídeo primeiro.');return}btn.disabled=true;status('Enviando…');try{const body={id,video_url:video,destino:btn.dataset.publish,caption:full.querySelector('textarea')?.value||'',privacy_level:box.querySelector('[data-tt-privacy]').value,is_aigc:box.querySelector('[data-tt-aigc]').checked};const r=await fetch('/.netlify/functions/publicar',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.erro||'Falha na publicação');status(btn.dataset.publish==='telegram'?`✅ Enviado para o Telegram @${j.channel}. Mensagem ${j.message_id||''}`:`✅ Enviado ao TikTok. ID: ${j.publish_id||''}\nStatus inicial: ${j.status||'processing'}`);}catch(e){status('❌ '+e.message)}finally{btn.disabled=false}});
   sync();
  });
 }catch(e){console.error('video-ui',e)}};

 function linkRow(label,url,doc,platform,id){return url?'<div class="produto-link-row"><b>'+label+'</b><input readonly value="'+esc(url)+'"><button type="button" data-open-link="'+esc(url)+'">Abrir</button></div>':'<div class="produto-link-row"><b>'+label+'</b><span class="video-small">Não cadastrado</span></div>'}
 function modalBase(doc,title,body){const m=doc.createElement('div');m.className='produto-modal';m.innerHTML='<div class="produto-modal-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h2 style="margin:0">'+title+'</h2><button type="button" data-close>✕</button></div>'+body+'</div>';m.querySelector('[data-close]').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};doc.body.appendChild(m);return m}
 async function abrirAdicionar(doc){
  const m=modalBase(doc,'➕ Adicionar produto','<p class="video-small">Cole um link da Shopee ou do TikTok Shop. O sistema tentará importar nome, imagem, descrição e preço.</p><input id="novo-link" placeholder="Cole aqui o link da Shopee ou TikTok Shop"><div class="row"><button type="button" class="pri" id="importar-produto">🔍 Importar produto</button></div><div id="novo-resultado"></div>');
  const input=m.querySelector('#novo-link'),btn=m.querySelector('#importar-produto'),res=m.querySelector('#novo-resultado');input.focus();btn.onclick=async()=>{const url=input.value.trim();if(!url){res.innerHTML='<p>Informe o link.</p>';return}btn.disabled=true;btn.textContent='⏳ Importando…';res.innerHTML='';try{const r=await fetch('/.netlify/functions/produto-adicionar',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({url})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.erro||'Falha ao importar');if(j.existente){res.innerHTML='<div class="produto-preview">'+(j.info?.image?'<img src="'+esc(j.info.image)+'">':'')+'<div><b>Produto já cadastrado</b><div class="video-small">'+esc(j.info?.name||'Produto')+'</div></div></div><p>Esse produto já está na fila. Você pode usar "Adicionar/vincular link" no produto para associar a outra plataforma.</p>';}else{res.innerHTML='<div class="produto-preview">'+(j.produto?.imagem?'<img src="'+esc(j.produto.imagem)+'">':'')+'<div><b>'+esc(j.produto?.nome||j.info?.name||'Produto')+'</b><div class="video-small">'+esc(j.info?.platform==='tiktok'?'TikTok Shop':'Shopee')+'</div><div style="margin-top:8px">Produto cadastrado com sucesso.</div></div></div><div class="row"><button type="button" class="ok" id="fechar-recarregar">✅ Fechar e atualizar</button></div>';m.querySelector('#fechar-recarregar').onclick=()=>{m.remove();d.querySelector('#coletar')?.click();setTimeout(()=>window.location.reload(),300)}}catch(e){res.innerHTML='<p style="color:#b33">❌ '+esc(e.message)+'</p>'}finally{btn.disabled=false;btn.textContent='🔍 Importar produto'}}
 }
 async function abrirVinculo(doc,id){
  const m=modalBase(doc,'🔗 Vincular outra plataforma','<p class="video-small">Cole o link da outra plataforma para associá-lo ao mesmo produto.</p><input id="vinculo-link" placeholder="Link da Shopee ou TikTok Shop"><div class="row"><button type="button" class="pri" id="salvar-vinculo">🔗 Salvar link</button></div><div id="vinculo-res"></div>');
  const input=m.querySelector('#vinculo-link'),btn=m.querySelector('#salvar-vinculo'),res=m.querySelector('#vinculo-res');input.focus();btn.onclick=async()=>{const url=input.value.trim();if(!url){res.textContent='Informe o link.';return}btn.disabled=true;btn.textContent='⏳ Salvando…';try{const r=await fetch('/.netlify/functions/produto-adicionar',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({acao:'vincular_link',id,url})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.erro||'Falha ao vincular');res.innerHTML='<p>✅ Link '+esc(j.plataforma)+' salvo no mesmo produto.</p><div class="row"><button type="button" class="ok" id="fechar-vinculo">Fechar</button></div>';m.querySelector('#fechar-vinculo').onclick=()=>{m.remove();window.location.reload()}}catch(e){res.innerHTML='<p style="color:#b33">❌ '+esc(e.message)+'</p>'}finally{btn.disabled=false;btn.textContent='🔗 Salvar link'}}
 }
 f.addEventListener('load',()=>{run();setInterval(run,700)});setInterval(run,1000);
})();
</script></body></html>
