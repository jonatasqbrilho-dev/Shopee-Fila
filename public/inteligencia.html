<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Central de Inteligência · Shopee Fila</title>
<style>
:root{color-scheme:light;--bg:#f4f6f4;--card:#fff;--ink:#202722;--muted:#66716a;--line:#dce2dd;--orange:#ee4d2d;--green:#16803c;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px}header .bar{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:21px;margin:0}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:12px 0 6px}main{max-width:1180px;margin:18px auto;padding:0 14px 60px}.sub,.muted{color:var(--muted);font-size:12px}.panel,.item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:13px}.tabs{display:flex;gap:6px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#202722;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}button,.btn{border:1px solid #202722;border-radius:8px;padding:9px 12px;background:#202722;color:#fff;font:700 13px system-ui;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--orange);border-color:var(--orange)}.green{background:var(--green);border-color:var(--green)}.light{background:#edf1ed;color:#202722;border-color:var(--line)}.danger{background:var(--red);border-color:var(--red)}input,select,textarea{font:inherit;border:1px solid #cbd4cd;border-radius:8px;padding:9px;background:#fff;color:var(--ink);min-width:0}input,select{max-width:100%}textarea{width:100%;min-height:64px}.formrow{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:4px;min-width:180px;flex:1}.field label{font-size:11px;color:var(--muted);font-weight:750}.product{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.product img{width:62px;height:62px;object-fit:cover;border-radius:8px;background:#eee}.score{font-weight:850;font-size:18px}.pill{display:inline-block;border-radius:30px;padding:3px 8px;background:#edf1ed;color:#45534a;font-size:11px}.pill.good{background:#e5f7e9;color:#176b30}.pill.warn{background:#fff2dd;color:#885500}.chip{display:inline-block;padding:5px 9px;margin:3px;border-radius:20px;background:#f0f3f0;border:1px solid var(--line);font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.offer,.result,.hook{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0}.result a{font-weight:700;color:#1b5f9b;overflow-wrap:anywhere}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase}.empty{padding:22px;text-align:center;color:var(--muted)}.notice{padding:10px;border-radius:9px;background:#fff7e6;border:1px solid #f1dfb8;color:#73520d;margin:10px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.hookgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.testrow{display:grid;grid-template-columns:1.2fr repeat(5,.65fr) auto;gap:7px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}.testrow label{display:flex;flex-direction:column;font-size:10px;color:var(--muted);gap:3px}.testrow input,.testrow select{width:100%;min-width:55px;padding:7px}.small{font-size:11px;color:var(--muted)}#login{max-width:330px;margin:25vh auto;display:grid;gap:10px;background:white;padding:22px;border-radius:14px;border:1px solid var(--line)}#toast{position:fixed;left:12px;right:12px;bottom:12px;max-width:850px;margin:auto;background:#202722;color:white;padding:12px;border-radius:10px;text-align:center;z-index:10}#toast[hidden]{display:none}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.hookgrid{grid-template-columns:1fr}.testrow{grid-template-columns:1fr 1fr}.product{grid-template-columns:52px 1fr}.product img{width:52px;height:52px}.product>.score{grid-column:2}.formrow .field{min-width:100%}header .bar{align-items:flex-start}}
</style></head><body>
<form id="login" hidden><h1>🧠 Shopee Fila</h1><div class="muted">Entre com a mesma senha do painel principal.</div><input id="password" type="password" placeholder="Senha do painel" autocomplete="current-password"><button class="primary">Entrar</button></form>
<div id="app" hidden><header><div class="bar"><div><h1>🧠 Central de Inteligência</h1><div class="sub">Pesquisa, SEO, ganchos, calendário e resultados do Shopee Fila</div></div><div class="actions" style="margin:0"><a class="btn light" href="/">← Painel principal</a><button id="refresh" class="light">↻ Atualizar</button></div></div></header><main>
<div id="stats" class="stats"></div><div class="tabs" id="tabs"><button data-tab="trends" class="active">📈 Tendências</button><button data-tab="competitors">🕵️ Concorrentes</button><button data-tab="seo">🔎 SEO</button><button data-tab="hooks">🎬 Ganchos</button><button data-tab="calendar">🗓️ Calendário</button><button data-tab="reports">💰 Resultados</button></div><section id="view"></section>
</main></div><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),today=()=>new Date().toISOString().slice(0,10),ago=n=>new Date(Date.now()-n*86400000).toISOString().slice(0,10);
let senha=localStorage.senha||"",tab="trends",data=null;
const notify=s=>{const e=$("#toast");e.textContent=s;e.hidden=false;setTimeout(()=>e.hidden=true,5000)};
async function api(url,body){const r=await fetch(url,{method:body?"POST":"GET",headers:{"x-senha":senha,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({erro:"Resposta inválida do servidor."}));if(r.status===401){localStorage.removeItem("senha");showLogin();throw Error("Senha incorreta ou sessão expirada.")}if(!r.ok||j.erro)throw Error(j.erro||"Falha na solicitação.");return j}
async function load(){try{data=await api("/.netlify/functions/inteligencia?acao=painel&inicio="+ago(30)+"&fim="+today());renderStats();render()}catch(e){notify(e.message)}}
function showLogin(){const ok=!!localStorage.senha;$("#login").hidden=ok;$("#app").hidden=!ok;if(ok)load()}
$("#login").onsubmit=e=>{e.preventDefault();senha=$("#password").value;localStorage.senha=senha;showLogin()};
$("#refresh").onclick=load;
$("#tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;$("#tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render()};
function renderStats(){const p=data.products||[],t=data.totals||{};$("#stats").innerHTML='<div class=stat><b>'+p.length+'</b><span>Produtos cadastrados</span></div><div class=stat><b>'+p.filter(x=>x.status==="pendente").length+'</b><span>Pendentes de aprovação</span></div><div class=stat><b>'+(t.orders||0)+'</b><span>Pedidos no histórico do período</span></div><div class=stat><b>'+brl(t.estimated_commission)+'</b><span>Comissão estimada no histórico</span></div>'}
function productOptions(){return (data.products||[]).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.nome)+'</option>').join("")}
function render(){const root=$("#view");if(!data){root.innerHTML='<div class=empty>Carregando dados…</div>';return}if(tab==="trends")renderTrends(root);else if(tab==="competitors")renderCompetitors(root);else if(tab==="seo")renderSEO(root);else if(tab==="hooks")renderHooks(root);else if(tab==="calendar")renderCalendar(root);else if(tab==="reports")renderReports(root)}
function renderTrends(root){const items=data.trend||[];let rows=items.slice(0,50).map((p,i)=>'<div class=product><img src="'+esc(p.imagem||"")+'" alt=""><div><b>'+(i+1)+'. '+esc(p.nome)+'</b><div class=small>'+Number(p.vendas||0).toLocaleString("pt-BR")+' vendas · ★ '+Number(p.avaliacao||0).toFixed(1)+' · comissão '+Math.round(Number(p.comissao||0)*100)+'% · '+brl(p.preco)+'</div><div class=small>Variação: +'+(p.sales_delta||0)+' · ritmo: '+(p.sales_per_day||0)+'/dia · '+esc(p.trend_state)+'</div></div><div class=score>'+p.potential_score+'<div class="pill '+(p.trend_confirmed?"good":"warn")+'">'+(p.trend_confirmed?"Medido":"Em observação")+'</div></div></div>').join("");root.innerHTML='<div class=panel><h2>Ranking de produtos com maior potencial</h2><div class=muted>Nota calculada com vendas atuais, variação observada, comissão, avaliação e desconto. Não é previsão nem garantia de vendas.</div><div class=notice>'+esc(data.notes?.trend||"Crescimento real depende de medições em datas diferentes.")+'</div>'+(rows||'<div class=empty>Nenhum produto cadastrado.</div>')+'</div>'}
function renderCompetitors(root){const latest=data.competitors||[];root.innerHTML='<div class=panel><h2>Pesquisa de concorrentes e comparação de ofertas</h2><div class=muted>Pesquisa referências públicas. Preços e avaliações só entram na comparação quando você os confirmar manualmente.</div><div class=formrow style="margin-top:12px"><div class=field><label>PRODUTO DO CATÁLOGO</label><select id=compProduct><option value="">Escolha um produto</option>'+productOptions()+'</select></div><button class=primary id=searchComp>Pesquisar concorrentes</button></div></div><div id=compResults></div><div class=panel><h2>Pesquisas anteriores</h2>'+(latest.length?latest.map(r=>'<div class=offer><b>'+esc(r.product_name)+'</b><div class=small>'+new Date(r.created_at).toLocaleString("pt-BR")+' · '+(r.results||[]).length+' referências · '+(r.offers||[]).length+' ofertas comparadas</div><button class=light data-research="'+r.id+'">Abrir comparação</button></div>').join(""):'<div class=empty>Nenhuma pesquisa salva.</div>')+'</div>';
$("#searchComp").onclick=async e=>{const id=$("#compProduct").value,p=data.products.find(x=>x.id===id);if(!p){notify("Escolha um produto.");return}e.target.disabled=true;try{const r=await api("/.netlify/functions/inteligencia",{acao:"pesquisar_concorrentes",product_id:id,product_name:p.nome});showResearch(r.research);notify("Pesquisa concluída. Confira os resultados e confirme os preços.")}catch(err){notify(err.message)}finally{e.target.disabled=false}};
root.querySelectorAll("[data-research]").forEach(b=>b.onclick=()=>showResearch(latest.find(x=>x.id===b.dataset.research)))}
function showResearch(r){const el=$("#compResults");if(!el||!r)return;const p=data.products.find(x=>x.id===r.product_id);let refs=(r.results||[]).map(x=>'<div class=result><a href="'+esc(x.url)+'" target=_blank rel=noopener>'+esc(x.title)+'</a><p class=small>'+esc(x.snippet||"Sem descrição disponível.")+'</p></div>').join("");let offers=(r.offers||[]).map(o=>'<div class=offer><b>'+esc(o.name)+'</b> · '+brl(o.price)+' <span class=pill>'+(o.price>Number(p?.preco||0)?"Mais caro":o.price<Number(p?.preco||0)?"Mais barato":"Mesmo preço")+'</span><div class=small>'+esc(o.seller||"Loja não informada")+' · '+new Date(o.observed_at).toLocaleDateString("pt-BR")+(o.url?' · <a href="'+esc(o.url)+'" target=_blank rel=noopener>abrir oferta</a>':"")+'</div></div>').join("");el.innerHTML='<div class=panel><h2>Referências: '+esc(r.product_name)+'</h2><div class=small>Os resultados são referências para verificação, não ofertas verificadas. Preço atual do seu produto: '+brl(p?.preco)+'</div><div class=grid2>'+(refs||'<div class=empty>Sem resultados públicos disponíveis.</div>')+'</div><h3>Comparação de ofertas confirmadas manualmente</h3><div class=formrow><div class=field><label>PRODUTO / OFERTA</label><input id=offerName placeholder="Nome da oferta"></div><div class=field><label>LOJA</label><input id=offerSeller placeholder="Nome da loja"></div><div class=field><label>PREÇO (R$)</label><input id=offerPrice type=number min=0 step=.01></div><div class=field><label>LINK HTTPS</label><input id=offerUrl placeholder="https://..."></div><button class=primary id=saveOffer>Adicionar</button></div>'+offers+'</div>';
$("#saveOffer").onclick=async()=>{try{const out=await api("/.netlify/functions/inteligencia",{acao:"adicionar_oferta",research_id:r.id,offer:{name:$("#offerName").value,seller:$("#offerSeller").value,price:$("#offerPrice").value,url:$("#offerUrl").value}});r.offers=out.offers;showResearch(r);notify("Oferta salva.")}catch(e){notify(e.message)}}}
function renderSEO(root){const history=data.keywords||[];root.innerHTML='<div class=panel><h2>Pesquisa e histórico de palavras-chave</h2><div class=muted>Combina sugestões públicas do Google com variações locais. Não representa volume absoluto nem posição no Google.</div><div class=formrow style="margin-top:12px"><div class=field><label>PRODUTO OU PALAVRA-CHAVE</label><input id=seoTerm placeholder="Ex.: organizador de cozinha"></div><div class=field><label>VINCULAR AO PRODUTO</label><select id=seoProduct><option value="">Sem vínculo</option>'+productOptions()+'</select></div><button class=primary id=searchSeo>Pesquisar</button></div><div id=seoResult></div></div><div class=panel><h2>Histórico de pesquisas</h2>'+(history.length?history.map(x=>'<div class=offer><b>'+esc(x.term)+'</b> <span class=pill>'+esc(x.category||"")+'</span><div class=small>'+new Date(x.created_at).toLocaleString("pt-BR")+' · '+esc(x.source||"")+'</div>'+((x.keywords||[]).slice(0,12).map(k=>'<span class=chip>'+esc(k)+'</span>').join(""))+'</div>').join(""):'<div class=empty>Nenhuma palavra-chave pesquisada.</div>')+'</div>';
$("#searchSeo").onclick=async e=>{const term=$("#seoTerm").value.trim();if(!term){notify("Informe um termo.");return}e.target.disabled=true;try{const r=await api("/.netlify/functions/inteligencia",{acao:"pesquisar_seo",term,product_id:$("#seoProduct").value||null});$("#seoResult").innerHTML='<div class=offer><b>'+esc(r.seo.term)+'</b> · '+esc(r.seo.category)+'<div class=small>'+esc(r.seo.source)+'</div>'+r.seo.keywords.map(k=>'<span class=chip>'+esc(k)+'</span>').join("")+'<div class=actions><a class="btn light" target=_blank rel=noopener href="https://trends.google.com/trends/explore?geo=BR&q='+encodeURIComponent(r.seo.keywords.slice(0,5).join(","))+'">Google Trends</a></div></div>';notify("Palavras-chave salvas.");await load()}catch(err){notify(err.message)}finally{e.target.disabled=false}}}
function renderHooks(root){const memories=data.memories||[],tests=data.hook_tests||[];let memoryHtml=memories.slice(0,20).map(m=>{const hooks=m.estrategia?.ganchos||[];return '<div class=hook><b>'+esc(m.produto_nome)+'</b><div class=small>'+esc(m.categoria)+' · '+new Date(m.criado_em).toLocaleString("pt-BR")+' · '+esc(m.feedback||"sem avaliação")+'</div><div class=hookgrid>'+hooks.map((h,i)=>'<div class=offer><span class=pill>'+esc(h.tipo)+'</span><p>'+esc(h.texto)+'</p><div class=small>'+esc(h.abertura_visual||"")+'</div><button class=light data-create-hook="'+m.id+'" data-hook-index="'+i+'">＋ Testar gancho</button></div>').join("")+'</div></div>'}).join("");let testHtml=tests.map(t=>'<div class=hook data-test="'+t.id+'"><b>'+esc(t.hook_text)+'</b> <span class=pill>'+esc(t.status)+'</span><div class=small>'+esc(t.hook_type)+' · '+esc(t.visual_open||"")+'</div><div class=testrow><label>STATUS<select data-field=status><option value=planejado '+(t.status==="planejado"?"selected":"")+'>Planejado</option><option value=publicado '+(t.status==="publicado"?"selected":"")+'>Publicado</option><option value=descartado '+(t.status==="descartado"?"selected":"")+'>Descartado</option></select></label>'+["impressions","views","clicks","orders"].map(k=>'<label>'+({impressions:"Impressões",views:"Visualizações",clicks:"Cliques",orders:"Pedidos"})[k]+'<input data-field="'+k+'" type=number min=0 value="'+(t[k]||0)+'"></label>').join("")+'<label>Comissão R$ <input data-field=revenue type=number min=0 step=.01 value="'+(t.revenue||0)+'"></label><button class=green data-save-test="'+t.id+'">Salvar</button></div><label class=small>Observação<textarea data-field=notes>'+esc(t.notes||"")+'</textarea></label><div class=small>CTR: '+(t.impressions?((t.clicks/t.impressions)*100).toFixed(2):"0,00")+'% · Conversão: '+(t.clicks?((t.orders/t.clicks)*100).toFixed(2):"0,00")+'%</div></div>').join("");root.innerHTML='<div class=panel><h2>Testes de ganchos do Diretor IA</h2><div class=muted>Registre qual variação foi publicada e preencha os resultados observados na plataforma.</div>'+(memoryHtml||'<div class=empty>As estratégias do Diretor IA aparecerão aqui após serem geradas.</div>')+'</div><div class=panel><h2>Experimentos registrados</h2>'+(testHtml||'<div class=empty>Nenhum teste registrado ainda.</div>')+'</div>';
root.querySelectorAll("[data-create-hook]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api("/.netlify/functions/inteligencia",{acao:"criar_teste_gancho",memory_id:b.dataset.createHook,hook_index:Number(b.dataset.hookIndex)});notify("Gancho adicionado aos testes.");await load()}catch(e){notify(e.message);b.disabled=false}});
root.querySelectorAll("[data-save-test]").forEach(b=>b.onclick=async()=>{const box=b.closest("[data-test]"),payload={acao:"atualizar_teste_gancho",id:b.dataset.saveTest};box.querySelectorAll("[data-field]").forEach(x=>payload[x.dataset.field]=x.type==="number"?Number(x.value):x.value);b.disabled=true;try{await api("/.netlify/functions/inteligencia",payload);notify("Resultados salvos.");await load()}catch(e){notify(e.message)}finally{b.disabled=false}})}
function renderCalendar(root){root.innerHTML='<div class=panel><h2>Calendário de publicações</h2><div class=muted>Planeje até 10 vídeos por dia. A fila organiza o trabalho; a publicação depende da ação e das permissões da plataforma.</div><div class=formrow style="margin-top:12px"><div class=field><label>DATA</label><input type=date id=calendarDate value="'+today()+'"></div><div class=field><label>PRODUTO</label><select id=calendarProduct><option value="">Selecione</option>'+productOptions()+'</select></div><button class=primary id=addCalendar>Adicionar à fila</button></div><div id=queueList></div></div>';
const qapi=(date,body)=>api("/.netlify/functions/shopee-video-fila"+(body?"":"?date="+date),body);
const draw=async()=>{try{const q=await qapi($("#calendarDate").value),items=q.items||[];$("#queueList").innerHTML='<div class=actions><span class=pill>'+items.length+'/10 vídeos</span><span class=pill>'+items.filter(x=>x.status==="publicado").length+' publicados</span><span class=pill>'+items.filter(x=>x.status==="pendente").length+' pendentes</span></div>'+(items.length?items.map((x,i)=>'<div class=offer><b>'+(i+1)+'. '+esc(x.product_name)+'</b> <span class=pill>' +esc(x.status)+'</span><div class=small>'+esc(x.caption||"Sem legenda")+'</div><div class=actions><button class=light data-queue-publish="'+x.id+'" data-status="'+x.status+'">'+(x.status==="publicado"?"Marcar pendente":"Marcar publicado")+'</button><button class=danger data-queue-delete="'+x.id+'">Excluir</button>'+(x.video_url?'<a class="btn light" href="'+esc(x.video_url)+'" target=_blank rel=noopener>Ver vídeo</a>':"")+'</div></div>').join(""):'<div class=empty>Nenhum vídeo planejado para esta data.</div>')}catch(e){$("#queueList").innerHTML='<div class=notice>'+esc(e.message)+'</div>'}};
$("#calendarDate").onchange=draw;
$("#addCalendar").onclick=async e=>{const p=data.products.find(x=>x.id===$("#calendarProduct").value);if(!p){notify("Selecione um produto.");return}e.target.disabled=true;try{await qapi("",{acao:"adicionar",product_id:p.id,product_name:p.nome,product_url:p.link_afiliado||p.link_produto,caption:p.legenda||""});notify("Produto adicionado à fila.");await draw()}catch(err){notify(err.message)}finally{e.target.disabled=false}};
$("#queueList").onclick=async e=>{const pub=e.target.closest("[data-queue-publish]"),del=e.target.closest("[data-queue-delete]");try{if(pub)await qapi("",{acao:"atualizar",id:pub.dataset.queuePublish,status:pub.dataset.status==="publicado"?"pendente":"publicado"});if(del)await qapi("",{acao:"excluir",id:del.dataset.queueDelete});if(pub||del)await draw()}catch(err){notify(err.message)}};draw()}
function renderReports(root){const rows=data.report||[],t=data.totals||{};root.innerHTML='<div class=panel><h2>Resultados por produto e período</h2><div class=muted>'+esc(data.notes?.reports||"O histórico começa a partir da ativação da central.")+'</div><div class=actions><span class=pill>Pedidos: '+(t.orders||0)+'</span><span class=pill>Itens: '+(t.items_sold||0)+'</span><span class=pill>Vendas: '+brl(t.order_value)+'</span><span class=pill>Comissão estimada: '+brl(t.estimated_commission)+'</span><span class=pill>Comissão validada: '+brl(t.validated_commission)+'</span></div>'+(rows.length?'<div class=tablewrap><table><thead><tr><th>Produto</th><th>Pedidos</th><th>Itens</th><th>Valor</th><th>Comissão est.</th><th>Comissão valid.</th><th>Medições</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.orders+'</td><td>'+x.items_sold+'</td><td>'+brl(x.order_value)+'</td><td>'+brl(x.estimated_commission)+'</td><td>'+brl(x.validated_commission)+'</td><td>'+x.snapshots+'</td></tr>').join("")+'</tbody></table></div>':'<div class=empty>Sem medições históricas suficientes neste período. Sincronize as métricas e volte depois para comparar.</div>')+'</div><div class=notice>Para atualizar conversões, use “Sincronizar métricas” no painel principal. A API de conversões da Shopee não fornece visualizações brutas dos vídeos.</div>'}
showLogin();
