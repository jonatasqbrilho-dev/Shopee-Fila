<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopee-Fila</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#edf0ee}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="painel" src="/index.html"></iframe><script>(function(){const f=document.getElementById('painel');function run(){try{const d=f.contentDocument;if(!d||!d.body)return;const style=d.createElement('style');style.textContent='.video-box{margin-top:9px;border:1px solid #d3dbd7;border-radius:10px;padding:9px;background:var(--bg)}.video-result{display:grid;grid-template-columns:90px 1fr;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.video-result img{width:90px;height:90px;object-fit:cover;border-radius:7px}.video-score{font-weight:800}.video-small{font-size:12px;color:var(--mut);margin-top:3px}@media(max-width:650px){.video-result{grid-template-columns:64px 1fr}.video-result img{width:64px;height:64px}}';d.head.appendChild(style);d.querySelectorAll('.card').forEach(card=>{if(card.dataset.videoUi)return;card.dataset.videoUi='1';const full=card.querySelector('.full');if(!full)return;const row=full.querySelector('.row');if(!row)return;const id=card.dataset.id;const b=d.createElement('button');b.type='button';b.textContent='🎬 Buscar vídeo';b.className='pri';b.dataset.videoSearch=id;row.insertBefore(b,row.firstChild);const box=d.createElement('div');box.className='video-box';box.hidden=true;box.innerHTML='<b>🎬 Vídeos encontrados</b><div class="video-list video-small">Clique em Buscar vídeo para pesquisar no Telegram.</div>';full.appendChild(box);b.onclick=async()=>{b.disabled=true;box.hidden=false;const list=box.querySelector('.video-list');list.textContent='Pesquisando vídeos no Telegram e analisando thumbnails…';try{const senha=d.defaultView.localStorage.senha||'';const r=await fetch('/.netlify/functions/video-busca',{method:'POST',headers:{'x-senha':senha,'content-type':'application/json'},body:JSON.stringify({acao:'buscar',produto_id:id,max_messages:80})});const j=await r.json();if(!j.ok)throw Error(j.erro||'Erro na busca');if(!j.resultados?.length){list.textContent='Nenhum vídeo encontrado.';return}list.innerHTML=j.resultados.map(x=>'<div class="video-result"><div>'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'">':'<div class="video-small">Sem thumbnail</div>')+'</div><div><div class="video-score">'+Number(x.match_score||0)+'% de correspondência</div><div class="video-small">'+esc(x.match_reason||'Sem justificativa')+'</div><div class="video-small">'+esc(x.telegram_caption||'Sem legenda')+'</div><div style="margin-top:6px"><a href="'+esc(x.telegram_message_url)+'" target="_blank" rel="noopener" class="btn">▶ Telegram</a> <button type="button" data-use-video="'+x.telegram_message_id+'" data-score="'+(x.match_score||0)+'">✅ Usar</button></div></div></div>').join('');list.querySelectorAll('[data-use-video]').forEach(u=>u.onclick=async()=>{u.disabled=true;u.textContent='Salvando…';try{const senha=d.defaultView.localStorage.senha||'';const rr=await fetch('/.netlify/functions/video-busca',{method:'POST',headers:{'x-senha':senha,'content-type':'application/json'},body:JSON.stringify({acao:'usar',produto_id:id,message_id:u.dataset.useVideo,score:u.dataset.score})});const jj=await rr.json();if(!jj.ok)throw Error(jj.erro||'Não foi possível salvar');u.textContent='✅ Salvo';}catch(e){u.disabled=false;u.textContent='✅ Usar';alert(e.message)}})}catch(e){list.textContent='Erro: '+e.message}finally{b.disabled=false}}});}catch(e){console.error(e)}}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}f.addEventListener('load',()=>{run();new MutationObserver(run).observe(f.contentDocument.body,{childList:true,subtree:true})});})();</script></body></html>
