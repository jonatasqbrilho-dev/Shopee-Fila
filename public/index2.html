<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopee-Fila</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#edf0ee}iframe{width:100%;height:100%;border:0}#add{position:fixed;inset:0;background:#0007;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}#add.open{display:flex}#addbox{width:min(560px,100%);background:#fff;color:#14201c;border-radius:14px;padding:18px;box-shadow:0 12px 50px #0006;font:14px system-ui}#addbox h2{margin:0 0 6px}#addbox p{color:#5a6a64}#addbox input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d3dbd7;border-radius:8px;font:inherit}#addbox button{padding:9px 12px;border:1px solid #d3dbd7;border-radius:8px;background:#fff;cursor:pointer;font:inherit}#addbox .pri{background:#ee4d2d;color:#fff;border-color:#ee4d2d}.status{margin-top:10px;white-space:pre-wrap;color:#5a6a64}.linkbtn{margin-top:8px!important}</style></head><body><iframe id="painel" src="/index.html"></iframe><div id="add"><div id="addbox"><div style="display:flex;justify-content:space-between;gap:8px"><h2>➕ Adicionar produto</h2><button id="close">✕</button></div><p>Cole o link de um produto da <b>Shopee</b> ou do <b>TikTok Shop</b>. O sistema tentará buscar nome, imagem, descrição e preço.</p><input id="url" placeholder="https://..."><div style="display:flex;gap:7px;margin-top:9px"><button id="go" class="pri">🔎 Importar produto</button><button id="cancel">Cancelar</button></div><div id="status" class="status"></div></div></div><script>(function(){const f=document.getElementById('painel'),modal=document.getElementById('add'),url=document.getElementById('url'),status=document.getElementById('status');const senha=()=>f.contentWindow?.localStorage?.senha||'';const open=()=>{modal.classList.add('open');url.focus()};const close=()=>modal.classList.remove('open');document.getElementById('close').onclick=close;document.getElementById('cancel').onclick=close;document.getElementById('go').onclick=async()=>{const u=url.value.trim();if(!u){status.textContent='Cole um link primeiro.';return}document.getElementById('go').disabled=true;status.textContent='🔎 Importando produto…';try{const r=await fetch('/.netlify/functions/produto-adicionar',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({url:u})});const j=await r.json();if(!r.ok||j.erro)throw Error(j.erro||'Falha ao importar');status.textContent='✅ Produto cadastrado!\n'+(j.info?.name||j.produto?.nome||'Produto')+'\nPlataforma: '+(j.info?.platform||'—')+'\nPreço: '+(j.info?.price?'R$ '+Number(j.info.price).toLocaleString('pt-BR',{minimumFractionDigits:2}):'não identificado');url.value='';setTimeout(()=>{close();f.contentWindow.location.reload()},900)}catch(e){status.textContent='❌ '+e.message}finally{document.getElementById('go').disabled=false}};function run(){try{const d=f.contentDocument;if(!d||!d.body)return;const c=d.querySelector('#coletar');if(c&&!d.querySelector('[data-add-product]')){const b=d.createElement('button');b.textContent='➕ Adicionar produto';b.className='pri';b.dataset.addProduct='1';b.onclick=open;c.parentNode.insertBefore(b,c.nextSibling)}d.querySelectorAll('.card').forEach(card=>{if(card.querySelector('[data-link-other]'))return;const full=card.querySelector('.full');if(!full)return;const row=d.createElement('div');row.className='row';const b=d.createElement('button');b.textContent='🔗 Adicionar link da outra plataforma';b.dataset.linkOther='1';b.className='linkbtn';b.onclick=async()=>{const v=prompt('Cole o link correspondente do outro site (Shopee ou TikTok Shop):');if(!v)return;try{b.disabled=true;const r=await fetch('/.netlify/functions/produto-adicionar',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({acao:'vincular_link',id:card.dataset.id,url:v})});const j=await r.json();if(!r.ok||j.erro)throw Error(j.erro||'Falha ao vincular');b.textContent='✅ Link vinculado';setTimeout(()=>f.contentWindow.location.reload(),500)}catch(e){alert(e.message)}finally{b.disabled=false}};row.appendChild(b);full.appendChild(row)})}catch(e){console.error('add-product-ui',e)}};f.addEventListener('load',()=>{run();setInterval(run,800)});setInterval(run,1200)})();</script></body></html>
