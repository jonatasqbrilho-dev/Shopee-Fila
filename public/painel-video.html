<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopee-Fila</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#edf0ee}#topbar{position:fixed;left:0;right:0;top:0;height:64px;background:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 18px;box-sizing:border-box;z-index:2147483647;border-bottom:1px solid #d7ddd9;box-shadow:0 2px 10px #0002}.add-produto-fixed{position:relative;border:0;border-radius:10px;padding:11px 18px;font:700 14px Arial,sans-serif;background:#111;color:#fff;cursor:pointer;box-shadow:0 4px 18px #0004}.add-produto-fixed:hover{background:#333}iframe{position:absolute;left:0;right:0;top:64px;width:100%;height:calc(100% - 64px);border:0}</style></head><body><div id="topbar"><button id="add-produto-fixed" class="add-produto-fixed" type="button">➕ Adicionar produto</button></div><iframe id="painel" src="/index.html"></iframe><script>
(function(){
 const f=document.getElementById('painel');const fixed=document.getElementById('add-produto-fixed');
 const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const senha=()=>f.contentWindow?.localStorage?.senha||'';
 function abrirFixo(){try{const d=f.contentDocument;if(d&&typeof abrirAdicionar==='function')abrirAdicionar(d);else alert('Aguarde o painel carregar.')}catch(e){alert('Aguarde o painel carregar.')}}

 const run=()=>{try{const d=f.contentDocument;if(!d||!d.body)return;let style=d.getElementById('video-ui-style');if(!style){style=d.createElement('style');style.id='video-ui-style';style.textContent=`

 const ordenar=d.getElementById('ordenar');if(ordenar&&!ordenar.querySelector('[value="vendas"]')){const o1=d.createElement('option');o1.value='vendas';o1.textContent='Quantidade de vendas (maior primeiro)';ordenar.appendChild(o1);const o2=d.createElement('option');o2.value='vendas_menor';o2.textContent='Quantidade de vendas (menor primeiro)';ordenar.appendChild(o2)}
 if(ordenar&&!ordenar.dataset.vendasSort){ordenar.dataset.vendasSort='1';const w=d.defaultView;const originalRender=w.renderLista;if(typeof originalRender==='function'){w.renderLista=function(){if(w.ordenar!=='vendas'&&w.ordenar!=='vendas_menor')return originalRender();const itens=[...(w.dados||[])];itens.sort((a,b)=>{const av=Number(a.vendas||0),bv=Number(b.vendas||0);return w.ordenar==='vendas'?bv-av:av-bv});d.getElementById('lista').innerHTML=itens.map(w.card).join('')}}}
 const coletar=d.getElementById('coletar');if(coletar&&!d.getElementById('adicionar-produto-btn')){const b=d.createElement('button');b.id='adicionar-produto-btn';b.className='pri';b.type='button';b.textContent='➕ Adicionar produto';coletar.parentNode.insertBefore(b,coletar.nextSibling);b.onclick=()=>abrirAdicionar(d)}
 d.querySelectorAll('.card').forEach(card=>{const full=card.querySelector('.full');if(!full)return;const id=card.dataset.id;if(!id)return;if(!card.querySelector('[data-delete-produto]')){const rowDel=full.querySelector('.row');const del=d.createElement('button');del.type='button';del.className='btn-delete-produto';del.dataset.deleteProduto='1';del.textContent='🗑️ Excluir produto';(rowDel||full).appendChild(del);del.onclick=async()=>{if(!confirm('Excluir este produto permanentemente?\n\nEsta ação não pode ser desfeita.'))return;del.disabled=true;del.textContent='⏳ Excluindo…';try{const r=await fetch('/.netlify/functions/produto-adicionar',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({acao:'deletar',id})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.erro||'Não foi possível excluir');card.remove();alert('Produto excluído com sucesso.')}catch(e){del.disabled=false;del.textContent='🗑️ Excluir produto';alert('Erro: '+e.message)}}}
 if(!card.querySelector('[data-cross-links]')){const box=d.createElement('div');box.className='produto-box';box.dataset.crossLinks='1';box.innerHTML='<b>🔗 Links do produto</b><div class="video-small">Carregando links…</div>';const before=full.querySelector('.row');if(before)full.insertBefore(box,before);else full.appendChild(box);const loadLinks=async()=>{try{const r=await fetch('/.netlify/functions/fila?status=pendente',{headers:{'x-senha':senha()}});if(!r.ok)return;let arr=await r.json();let p=arr.find(x=>String(x.id)===String(id));if(!p){for(const s of ['aprovado','publicado','sem_video','rejeitado','descartado']){const rr=await fetch('/.netlify/functions/fila?status='+s,{headers:{'x-senha':senha()}});if(rr.ok){const aa=await rr.json();p=aa.find(x=>String(x.id)===String(id));if(p)break}}}if(!p)return;const l=p.links_plataforma||{};box.innerHTML='<b>🔗 Links do produto</b>'+linkRow('TikTok Shop',l.tiktok)+linkRow('Shopee',l.shopee||p.link_produto);box.innerHTML+='<div class="row" style="margin-top:7px"><button type="button" data-add-link>➕ Adicionar/vincular link</button></div>';box.querySelector('[data-add-link]').onclick=()=>abrirVinculo(d,id);box.querySelectorAll('[data-open-link]').forEach(a=>a.onclick=()=>window.open(a.dataset.openLink,'_blank','noopener,noreferrer'))}catch{}};loadLinks()}
 const existing=card.querySelector('[data-publish-box]');if(existing)return;const row=full.querySelector('.row');if(row&&!card.querySelector('[data-video-search]')){const b=d.createElement('button');b.type='button';b.textContent='🎬 Buscar vídeo';b.className='pri';b.dataset.videoSearch='1';row.insertBefore(b,row.firstChild);const box=d.createElement('div');box.className='video-box';box.hidden=true;box.innerHTML='<b>🎬 Vídeos encontrados</b><div class="video-list video-small">Clique em Buscar vídeo para pesquisar no Telegram.</div>';full.appendChild(box);b.onclick=async()=>{b.disabled=true;box.hidden=false;const list=box.querySelector('.video-list');list.textContent='Pesquisando vídeos no Telegram e analisando thumbnails…';try{const r=await fetch('/.netlify/functions/video-busca',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({acao:'buscar',produto_id:id,max_messages:80})});const j=await r.json();if(!j.ok)throw Error(j.erro||'Erro na busca');if(!j.resultados?.length){list.textContent='Nenhum vídeo encontrado.';return}list.innerHTML=j.resultados.map(x=>'<div class="video-result"><div>'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'">':'<div class="video-small">Sem thumbnail</div>')+'</div><div><div class="video-score">'+Number(x.match_score||0)+'% de correspondência</div><div class="video-small">'+esc(x.match_reason||'Sem justificativa')+'</div><div class="video-small">'+esc(x.telegram_caption||'Sem legenda')+'</div><div style="margin-top:6px"><a href="'+esc(x.telegram_message_url||'#')+'" target="_blank" rel="noopener" class="btn">▶ Telegram</a> <button type="button" data-use-video="'+x.telegram_message_id+'" data-score="'+(x.match_score||0)+'">✅ Usar</button></div></div></div>').join('');list.querySelectorAll('[data-use-video]').forEach(u=>u.onclick=async()=>{u.disabled=true;u.textContent='Salvando…';try{const rr=await fetch('/.netlify/functions/video-busca',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({acao:'usar',produto_id:id,message_id:u.dataset.useVideo,score:u.dataset.score})});const jj=await rr.json();if(!jj.ok)throw Error(jj.erro||'Não foi possível salvar');u.textContent='✅ Salvo'}catch(e){u.disabled=false;u.textContent='✅ Usar';alert(e.message)}})}catch(e){list.textContent='Erro: '+e.message}finally{b.disabled=false}}}
 const box=d.createElement('div');box.className='publish-box';box.dataset.publishBox='1';box.hidden=true;box.innerHTML='<div class="publish-title">📤 Publicar este vídeo</div><div class="row"><button type="button" data-publish="telegram" class="ok">📲 Enviar para Telegram</button><button type="button" data-publish="tiktok" class="pri">🎵 Enviar para TikTok</button><button type="button" data-connect-tiktok>🔗 Conectar TikTok</button></div><div class="row"><label>Privacidade TikTok <select data-tt-privacy><option value="PUBLIC_TO_EVERYONE">Público</option><option value="SELF_ONLY">Somente eu</option></select></label><label><input type="checkbox" data-tt-aigc checked> Vídeo gerado por IA</label></div><div class="publish-status" data-publish-status></div>';full.appendChild(box);const getVideo=()=>card.dataset.video||full.querySelector('a[download][href]')?.href||'';const sync=()=>{const v=getVideo();box.hidden=!v;return v};sync();const status=msg=>box.querySelector('[data-publish-status]').textContent=msg;box.querySelector('[data-connect-tiktok]').onclick=()=>{window.open('/.netlify/functions/publicar?oauth=start','_blank','noopener,noreferrer');status('Abrindo autorização do TikTok…')};box.querySelectorAll('[data-publish]').forEach(btn=>btn.onclick=async()=>{const video=sync();if(!video){status('Anexe o vídeo primeiro.');return}btn.disabled=true;status('Enviando…');try{const r=await fetch('/.netlify/functions/publicar',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({id,video_url:video,destino:btn.dataset.publish,caption:full.querySelector('textarea')?.value||'',privacy_level:box.querySelector('[data-tt-privacy]').value,is_aigc:box.querySelector('[data-tt-aigc]').checked})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.erro||'Falha na publicação');status('✅ Publicado. ID: '+(j.publish_id||j.message_id||''))}catch(e){status('❌ '+e.message)}finally{btn.disabled=false}});sync()})}catch(e){console.error('video-ui',e)}};
 function linkRow(label,url){return url?'<div class="produto-link-row"><b>'+label+'</b><input readonly value="'+esc(url)+'"><button type="button" data-open-link="'+esc(url)+'">Abrir</button></div>':'<div class="produto-link-row"><b>'+label+'</b><span class="video-small">Não cadastrado</span></div>'}
 function modalBase(doc,title,body){const m=doc.createElement('div');m.className='produto-modal';m.innerHTML='<div class="produto-modal-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h2 style="margin:0">'+title+'</h2><button type="button" data-close>✕</button></div>'+body+'</div>';m.querySelector('[data-close]').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};doc.body.appendChild(m);return m}
 async function abrirAdicionar(doc){const m=modalBase(doc,'➕ Adicionar produto','<p class="video-small">Cole um link da Shopee ou do TikTok Shop. O sistema tentará importar nome, imagem, descrição e preço.</p><input id="novo-link" placeholder="Cole aqui o link da Shopee ou TikTok Shop"><div class="row"><button type="button" class="pri" id="importar-produto">🔍 Importar produto</button></div><div id="novo-resultado"></div>');const input=m.querySelector('#novo-link'),btn=m.querySelector('#importar-produto'),res=m.querySelector('#novo-resultado');input.focus();btn.onclick=async()=>{const url=input.value.trim();if(!url){res.innerHTML='<p>Informe o link.</p>';return}btn.disabled=true;btn.textContent='⏳ Importando…';try{const r=await fetch('/.netlify/functions/produto-adicionar',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({url})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.erro||'Falha ao importar');if(j.existente){res.innerHTML='<p>Produto já cadastrado: '+esc(j.info?.name||'Produto')+'</p>'}else{res.innerHTML='<p>✅ Produto cadastrado: '+esc(j.produto?.nome||j.info?.name||'Produto')+'</p><button type="button" id="fechar-recarregar">Fechar e atualizar</button>';m.querySelector('#fechar-recarregar').onclick=()=>{m.remove();doc.defaultView.location.reload()}}}catch(e){res.innerHTML='<p style="color:#b33">❌ '+esc(e.message)+'</p>'}finally{btn.disabled=false;btn.textContent='🔍 Importar produto'}}}

 f.addEventListener('load',()=>{run();setInterval(run,700)});setInterval(run,1000);
