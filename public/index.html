<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Shopee-Fila</title>
<style>:root{--bg:#edf0ee;--ink:#14201c;--mut:#5a6a64;--card:#fff;--line:#d3dbd7;--acc:#ee4d2d;--ok:#1f8a5b;--warn:#b7791f}@media(prefers-color-scheme:dark){:root{--bg:#0e1512;--ink:#e7eeea;--mut:#8ea298;--card:#17211d;--line:#2a3833}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:900px;margin:auto;padding:16px 14px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:20px;margin:0}button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 11px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.55}.pri{background:var(--acc);border-color:var(--acc);color:#fff}.ok{background:var(--ok);border-color:var(--ok);color:#fff}nav{display:flex;gap:6px;overflow:auto;margin-bottom:12px}nav button{white-space:nowrap}.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px}.stat b{display:block;font-size:18px}.stat span{color:var(--mut);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:84px 1fr;gap:12px}.card img{width:84px;height:84px;object-fit:cover;border-radius:8px;background:var(--line)}.nome{font-weight:650;margin:0 0 4px;overflow-wrap:anywhere}.meta{color:var(--mut);font-size:12px}.full{grid-column:1/-1}.card.min{grid-template-columns:84px 1fr}.card.min .full{display:none}.card.min .mini-toggle{grid-column:1/-1}.mini-toggle{margin-left:auto;white-space:nowrap}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:8px}.row label{display:flex;gap:4px;align-items:center}.nota{display:inline-block;font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid;margin-right:6px}.alta{color:var(--ok)}.media{color:var(--warn)}textarea{width:100%;min-height:60px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}details{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:9px}summary{cursor:pointer;font-weight:650}.copy{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:9px;margin-top:7px;overflow-wrap:anywhere}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 7px;font-size:12px}.vazio,#msg{color:var(--mut);text-align:center;padding:22px 8px}#toast{position:fixed;left:12px;right:12px;bottom:14px;max-width:876px;margin:auto;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;text-align:center;z-index:20;box-shadow:0 4px 18px #0004}#toast[hidden]{display:none}#login{max-width:320px;margin:30vh auto;display:grid;gap:10px}#login input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}@media(max-width:650px){.stats{grid-template-columns:repeat(3,1fr)}.card{grid-template-columns:64px 1fr}.card img{width:64px;height:64px}}
</style></head><body><main><form id="login" hidden><h1>Shopee-Fila</h1><input id="senha" type="password" placeholder="Senha do painel"><button class="pri">Entrar</button></form><section id="app" hidden><header><div><h1>🛍️ Shopee-Fila</h1><div id="ultima" class="meta"></div></div><div class="row" style="margin:0"><button id="coletar">Coletar agora</button><button id="sync">🔄 Sincronizar métricas</button><button id="campos">API vídeo</button></div></header><div id="stats" class="stats"></div><nav id="abas"></nav><div class="row" style="margin:0 0 12px"><label for="ordenar">Ordenar por:</label><select id="ordenar" style="font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)"><option value="recente">Atualização mais recente</option><option value="alfabetica">Nome (A–Z)</option><option value="nota">Nota da IA (maior primeiro)</option><option value="nota_menor">Nota da IA (menor primeiro)</option><option value="comissao">Comissão (maior primeiro)</option><option value="comissao_menor">Comissão (menor primeiro)</option></select></div><div id="lista"></div><div id="msg"></div></section><div id="toast" role="status" hidden></div></main>
<script>
const $=s=>document.querySelector(s),ABAS={pendente:"Pendentes",aprovado:"Aprovados",publicado:"Publicados",sem_video:"Sem vídeo",rejeitado:"Rejeitados",descartado:"Descartados pela IA"},PLAT={tiktok:"TikTok",youtube:"YouTube",instagram:"Instagram",telegram:"Telegram"};let senha=localStorage.senha||"",aba="pendente",ordenar="recente",dados=[];
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),fmtData=s=>s?new Date(s).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"—",toast=t=>{const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(window._t);window._t=setTimeout(()=>e.hidden=true,7000)};
async function api(m,b,q=""){const r=await fetch("/.netlify/functions/fila"+q,{method:m,headers:{"x-senha":senha,"content-type":"application/json"},body:b&&JSON.stringify(b)});if(r.status===401){localStorage.removeItem("senha");mostrar();throw 0}return r.json()}
function mostrar(){const ok=!!localStorage.senha;$("#login").hidden=ok;$("#app").hidden=!ok;if(ok)carregar()}
$("#login").onsubmit=e=>{e.preventDefault();senha=$("#senha").value;localStorage.senha=senha;mostrar()};
function stats(r){$("#stats").innerHTML=`<div class=stat><b>${r.cliques||0}</b><span>Cliques* </span></div><div class=stat><b>${r.pedidos||0}</b><span>Pedidos</span></div><div class=stat><b>${r.itens||0}</b><span>Itens</span></div><div class=stat><b>${brl(r.vendas)}</b><span>Vendas</span></div><div class=stat><b>${brl(r.estimada)}</b><span>Comissão est.</span></div><div class=stat><b>${brl(r.validada)}</b><span>Comissão valid.</span></div>`}
function pacote(p){if(!p.video_prompt&&!p.pacote_gerado_em)return `<div class=row><button data-acao="gerar_conteudo" class="pri">🤖 Gerar pacote de conteúdo</button></div>`;if(!p.video_prompt)return "";return `<details open><summary>🎬 Prompt do vídeo</summary><div class=copy>${esc(p.video_prompt)}</div><button data-copy="${encodeURIComponent(p.video_prompt)}">📋 Copiar prompt</button></details>`}
function metricas(p){return `<div class=meta style="margin-top:8px">📊 ${p.cliques_convertidos||0} cliques associados a conversões · 🛒 ${p.pedidos||0} pedidos · 📦 ${p.itens_vendidos||0} itens · 💰 ${brl(p.valor_pedidos)} · 💵 ${brl(p.comissao_estimada)} est. · ✅ ${brl(p.comissao_validada)} valid. · 📈 ${Number(p.conversao||0).toFixed(2)}%</div>`}
function links(p){const l=p.links_plataforma||{};return Object.keys(l).some(k=>l[k])?`<details><summary>🔗 Links rastreáveis por plataforma</summary>${Object.entries(l).filter(([,v])=>v).map(([k,v])=>`<div class=row><b>${PLAT[k]||k}</b><input style="flex:1;min-width:180px" readonly value="${esc(v)}"><button data-copy="${encodeURIComponent(v)}">Copiar</button></div>`).join("")}</details>`:`<button data-acao="gerar_links">🔗 Gerar links por plataforma</button>`}
function card(p){const pend=aba==="pendente",apr=aba==="aprovado",cls=p.nota>=85?"alta":"media";return `<article class="card min" data-id="${p.id}"><img src="${esc(p.imagem)}" alt="" loading=lazy><div><div style="display:flex;gap:8px;align-items:flex-start"><p class=nome style="flex:1">${esc(p.nome)}</p><button class="mini-toggle" type="button" data-acao="minimizar">＋ Máxima</button></div><div class=meta>${brl(p.preco)} · ${p.desconto||0}% off · ${p.vendas||0} vendidos · ★ ${p.avaliacao||0} · comissão ${((p.comissao||0)*100).toFixed(0)}%</div><div class=meta style="margin-top:3px">🕒 Atualizado: ${fmtData(p.atualizado_em)}</div><div style="margin-top:6px"><span class="nota ${cls}">${p.nota||0}</span><span class=meta>${esc(p.motivo)}</span></div></div><div class=full><div class=meta>🕒 Atualizado em ${fmtData(p.atualizado_em)}</div>${metricas(p)}<textarea ${pend?"":"readonly"}>${esc(p.legenda)}</textarea>${pacote(p)}${links(p)}<div class=row><a class=btn target=_blank rel=noopener href="${esc(p.link_produto||p.link_afiliado)}">Abrir na Shopee</a>${pend?`<label class=btn>Anexar vídeo (opcional)<input type=file accept="video/*" hidden data-acao=arquivo></label><span class=meta data-st>Nenhum vídeo — opcional</span>`:""}${apr&&p.video_url?`<a class=btn href="${esc(p.video_url)}" download target=_blank>Baixar vídeo</a>`:""}</div>${pend?`<div class=row>${Object.entries(PLAT).map(([k,v])=>`<label><input type=checkbox value="${k}">${v}</label>`).join("")}</div><div class=row><button class=ok data-acao=aprovar>✅ Aprovar produto</button><button data-acao=rejeitar>Rejeitar</button><button data-acao=sem_video>Sem vídeo</button></div>`:""}${apr?`<div class=row><button class=ok data-acao=publicado>Marcar como publicado</button></div>`:""}</div></article>`}
function renderLista(){const itens=[...dados];itens.sort((a,b)=>{if(ordenar==="alfabetica")return String(a.nome||"").localeCompare(String(b.nome||""),"pt-BR",{sensitivity:"base"});if(ordenar==="nota")return Number(b.nota||0)-Number(a.nota||0);if(ordenar==="nota_menor")return Number(a.nota||0)-Number(b.nota||0);if(ordenar==="comissao")return Number(b.comissao||0)-Number(a.comissao||0);if(ordenar==="comissao_menor")return Number(a.comissao||0)-Number(b.comissao||0);return new Date(b.atualizado_em||0)-new Date(a.atualizado_em||0)});$("#lista").innerHTML=itens.map(card).join("");}
$("#ordenar").addEventListener("change",e=>{ordenar=e.target.value;renderLista()});
async function carregar(){$("#abas").innerHTML=Object.entries(ABAS).map(([k,v])=>`<button data-aba="${k}" class="${k===aba?"on":""}">${v}</button>`).join("");$("#msg").textContent="Carregando…";dados=await api("GET",null,"?status="+aba);renderLista();const datas=dados.map(p=>p.atualizado_em).filter(Boolean).sort().reverse();$("#ultima").textContent=datas.length?`Última atualização: ${fmtData(datas[0])}`:"Ainda não há atualização registrada.";$("#msg").textContent=dados.length?"":"Nada aqui. Toque em Coletar agora para buscar produtos.";try{stats(await api("GET",null,"?resumo=1"))}catch{}}
document.addEventListener("click",async e=>{const t=e.target;if(t.dataset.copy!==undefined){try{await navigator.clipboard.writeText(decodeURIComponent(t.dataset.copy));toast("Copiado.")}catch{toast("Não foi possível copiar.")}return}if(t.dataset.aba){aba=t.dataset.aba;return carregar()}if(t.id==="coletar"){t.disabled=true;const inicio=new Date();toast(`Iniciando coleta às ${fmtData(inicio.toISOString())}…`);try{const r=await fetch("/.netlify/functions/coletar-background",{method:"POST",headers:{"x-senha":senha}});if(!r.ok){throw new Error(r.status===401?"Senha inválida ou sessão expirada.":"Não foi possível iniciar a coleta.");}toast("Coleta iniciada. Acompanhando o processamento…");let tentativas=0;const acompanhar=async()=>{tentativas++;try{const sr=await fetch("/.netlify/functions/coleta-status",{headers:{"x-senha":senha}});if(!sr.ok)throw new Error("status");const s=await sr.json();if(s.status==="done"){t.disabled=false;await carregar();let detalhe="";if(Array.isArray(s.detalhes)){detalhe=" "+s.detalhes.map(x=>x.palavra_chave+": "+x.encontrados+" encontrados, "+x.elegiveis+" elegíveis, "+(x.novos||0)+" novos, "+(x.atualizados||0)+" atualizados"+(x.erro?"; erro: "+x.erro:"")).join(" | ")}toast(`Coleta concluída às ${fmtData(s.fim)}. ${s.adicionados||0} novo(s), ${s.atualizados||0} produto(s) atualizado(s).`+detalhe);return}if(s.status==="error"){t.disabled=false;toast("Coleta falhou: "+(s.erro||"erro desconhecido"));return}}catch{}if(tentativas>=60){t.disabled=false;toast("A coleta ainda está processando. Atualize a tela em alguns minutos para conferir os produtos.");await carregar();return}setTimeout(acompanhar,3000)};setTimeout(acompanhar,1500)}catch(e){t.disabled=false;toast(e.message||"Erro ao iniciar a coleta.")}return}if(t.id==="sync"){t.disabled=true;const r=await api("POST",{acao:"sincronizar_metricas"});t.disabled=false;toast(r.erro||`Métricas: ${r.produtos_atualizados||0} produtos atualizados. ${r.aviso||""}`);if(!r.erro)carregar();return}if(t.id==="campos"){const r=await api("GET",null,"?campos=1");return toast(r.erro?"Erro: "+r.erro:"Vídeo: "+(r.video.join(", ")||"nenhum")+" | Imagens: "+(r.imagens.join(", ")||"nenhuma"))}const el=t.closest(".card"),a=t.dataset.acao;if(!el||!a||a==="arquivo")return;const id=el.dataset.id;if(a==="minimizar"){el.classList.add("min");t.textContent="＋ Máxima";t.dataset.acao="maximizar";return}if(a==="maximizar"){el.classList.remove("min");t.textContent="− Minimizar";t.dataset.acao="minimizar";return}if(a==="gerar_conteudo"||a==="gerar_links"){t.disabled=true;const r=await api("POST",{id,acao:a});toast(r.erro||"Pronto.");if(!r.erro)carregar();return}const body={id,acao:a};if(a==="aprovar"){body.legenda=el.querySelector("textarea").value;body.video_url=el.dataset.video||null;body.plataformas=[...el.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value)}t.disabled=true;const r=await api("POST",body);toast(r.erro||r.aviso||"Produto aprovado.");if(!r.erro)carregar();else t.disabled=false});
document.addEventListener("change",async e=>{const f=e.target;if(f.dataset.acao!=="arquivo"||!f.files[0])return;const el=f.closest(".card"),st=el.querySelector("[data-st]"),file=f.files[0];st.textContent="Enviando…";try{const u=await api("POST",{id:el.dataset.id,acao:"upload_url",ext:file.name.split(".").pop()});const r=await fetch(u.url,{method:"PUT",headers:{"Content-Type":file.type||"video/mp4"},body:file});if(!r.ok)throw 0;el.dataset.video=u.publico;st.textContent="Vídeo anexado: "+file.name}catch{st.textContent="Falha no envio. Tente novamente."}});mostrar();
</script></body></html>
