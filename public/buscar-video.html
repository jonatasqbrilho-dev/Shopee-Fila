<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buscar vídeo · Shopee-Fila</title><style>:root{--bg:#edf0ee;--ink:#14201c;--mut:#5a6a64;--card:#fff;--line:#d3dbd7;--acc:#ee4d2d;--ok:#1f8a5b}@media(prefers-color-scheme:dark){:root{--bg:#0e1512;--ink:#e7eeea;--mut:#8ea298;--card:#17211d;--line:#2a3833}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:900px;margin:auto;padding:18px 14px 70px}h1{margin:0 0 4px}.meta{color:var(--mut);font-size:12px}.box,.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}label{display:block;font-weight:650;margin-top:10px}input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer;text-decoration:none;display:inline-block}.pri{background:var(--acc);border-color:var(--acc);color:#fff}.ok{background:var(--ok);border-color:var(--ok);color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.result{display:grid;grid-template-columns:170px 1fr;gap:12px}.result img{width:170px;height:170px;object-fit:cover;border-radius:10px;background:var(--line)}.score{font-size:20px;font-weight:800}.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}.err{color:#b33}.empty{text-align:center;color:var(--mut);padding:25px}@media(max-width:600px){.result{grid-template-columns:1fr}.result img{width:100%;height:220px}}</style></head><body><main><h1>🎬 Buscar vídeo do produto</h1><div class="meta">Pesquisa no @packsdevideosgratis, compara o produto com thumbnails dos vídeos usando IA e permite salvar o melhor vídeo no produto.</div><section class="box"><label>Senha do painel</label><input id="senha" type="password" placeholder="Senha do Shopee-Fila"><label>Nome do produto</label><input id="nome" placeholder="Ex.: Kit Vila Natalina"><label>Link da Shopee</label><input id="link" placeholder="https://s.shopee.com.br/..."><input id="produto" type="hidden"><div class="row"><button class="pri" id="buscar">🔎 Buscar e analisar vídeos</button><a class="btn" href="/">← Voltar ao painel</a></div><div id="status" class="meta" style="margin-top:10px"></div></section><section id="resultados"></section></main><script>const $=s=>document.querySelector(s);let senha=localStorage.senha||"";$("#senha").value=senha;const q=new URLSearchParams(location.search);if(q.get("id"))$("#produto").value=q.get("id");function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}async function api(body){senha=$("#senha").value;localStorage.senha=senha;const r=await fetch("/.netlify/functions/video-busca",{method:"POST",headers:{"x-senha":senha,"content-type":"application/json"},body:JSON.stringify(body)});return r.json()}function render(rs){$("#resultados").innerHTML=rs.length?rs.map(x=>`<article class=result><div>${x.thumbnail_url?`<img src="${esc(x.thumbnail_url)}">`:`<div class=empty>Sem thumbnail</div>`}</div><div><div class=score>${Number(x.match_score||0)}% de correspondência</div><div class=bar><i style="width:${Math.min(100,Number(x.match_score||0))}%"></i></div><p>${esc(x.match_reason||"Sem justificativa")}</p><div class=meta>${esc(x.telegram_caption||"Sem legenda")}</div><div class=row><a class=btn target=_blank rel=noopener href="${esc(x.telegram_message_url)}">▶ Abrir no Telegram</a>${$("#produto").value?`<button class=ok data-id="${x.telegram_message_id}" data-score="${x.match_score}">✅ Usar este vídeo</button>`:""}</div></div></article>`).join(""):"<div class=box empty>Nenhum vídeo encontrado.</div>"}$("#buscar").onclick=async()=>{const nome=$("#nome").value.trim(),link=$("#link").value.trim(),id=$("#produto").value;if(!nome){$("#status").textContent="Informe o nome do produto.";return}$("#buscar").disabled=true;$("#status").textContent="Pesquisando vídeos e fazendo a análise visual…";$("#resultados").innerHTML="";try{const r=await api({acao:"buscar",produto_id:id||undefined,nome,link,max_messages:80});if(!r.ok)throw Error(r.erro||"Erro na busca");render(r.resultados||[]);$("#status").textContent=`${(r.resultados||[]).length} resultado(s) analisado(s). Canal: @${r.canal}`;}catch(e){$("#status").innerHTML=`<span class=err>${esc(e.message)}</span>`}finally{$("#buscar").disabled=false}};document.addEventListener("click",async e=>{const b=e.target.closest("button[data-id]");if(!b)return;b.disabled=true;b.textContent="Salvando…";try{const r=await api({acao:"usar",produto_id:$("#produto").value,message_id:b.dataset.id,score:b.dataset.score});if(!r.ok)throw Error(r.erro||"Não foi possível salvar");b.textContent="✅ Vídeo salvo";$("#status").textContent="Vídeo baixado do Telegram e associado ao produto com sucesso."}catch(err){b.disabled=false;b.textContent="✅ Usar este vídeo";$("#status").innerHTML=`<span class=err>${esc(err.message)}</span>`}});</script></body></html>
