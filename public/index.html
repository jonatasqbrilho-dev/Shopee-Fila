<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Fila de produtos</title>
<style>
:root{--bg:#EDF0EE;--ink:#14201C;--mut:#5A6A64;--card:#fff;--line:#D3DBD7;--acc:#EE4D2D;--ok:#1F8A5B;--warn:#B7791F}
@media(prefers-color-scheme:dark){:root{--bg:#0E1512;--ink:#E7EEEA;--mut:#8EA298;--card:#17211D;--line:#2A3833;--warn:#E0A94A}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 14px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}.ok{background:var(--ok);border-color:var(--ok);color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}nav button{white-space:nowrap}nav .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 6px 6px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:84px 1fr;gap:12px}
.card img{width:84px;height:84px;object-fit:cover;border-radius:8px;background:var(--line)}
.nome{font-weight:600;margin:0 0 4px;overflow-wrap:anywhere}.meta{color:var(--mut);font-size:13px}
.nota{display:inline-block;font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid;margin-right:6px}
.alta{color:var(--ok)}.media{color:var(--warn)}
.full{grid-column:1/-1}textarea{width:100%;min-height:64px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.row label{display:flex;gap:4px;align-items:center}
.vazio,#msg{color:var(--mut);text-align:center;padding:24px 8px}
#toast{position:fixed;max-height:50vh;overflow:auto;overflow-wrap:anywhere;left:12px;right:12px;bottom:14px;max-width:696px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;text-align:center;z-index:20;box-shadow:0 4px 18px #0004}#toast[hidden]{display:none}
#login{max-width:320px;margin:30vh auto;display:grid;gap:10px}#login input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style></head><body><main>
<form id="login" hidden><h1>Fila de produtos</h1><input id="senha" type="password" placeholder="Senha do painel" autocomplete="current-password"><button class="pri">Entrar</button></form>
<section id="app" hidden>
<header><h1>Fila de produtos</h1><div class="row" style="margin:0"><button id="coletar">Coletar agora</button><button id="campos">Testar vídeo na API</button></div></header>
<nav id="abas"></nav><div id="lista"></div><div id="msg"></div></section><div id="toast" role="status" hidden></div></main>
<script>
const $=s=>document.querySelector(s),ABAS={pendente:"Pendentes",aprovado:"Aprovados",publicado:"Publicados",sem_video:"Sem vídeo",rejeitado:"Rejeitados",descartado:"Descartados pela IA"};
const PLAT={tiktok:"TikTok",youtube:"YouTube",instagram:"Instagram"};
let senha=localStorage.senha||"",aba="pendente";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const toast=t=>{const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(window._t);window._t=setTimeout(()=>e.hidden=true,6000)};
async function api(m,body,q=""){const r=await fetch("/.netlify/functions/fila"+q,{method:m,headers:{"x-senha":senha,"content-type":"application/json"},body:body&&JSON.stringify(body)});
 if(r.status===401){localStorage.removeItem("senha");mostrar();throw 0}return r.json()}
function mostrar(){const ok=!!localStorage.senha;$("#login").hidden=ok;$("#app").hidden=!ok;if(ok)carregar()}
$("#login").onsubmit=e=>{e.preventDefault();senha=$("#senha").value;localStorage.senha=senha;mostrar()};
function card(p){const pend=aba==="pendente",apr=aba==="aprovado",cls=p.nota>=85?"alta":"media";
 return `<article class="card" data-id="${p.id}"><img src="${esc(p.imagem)}" alt="" loading="lazy">
 <div><p class="nome">${esc(p.nome)}</p><div class="meta">${brl(p.preco)} · ${p.desconto||0}% off · ${p.vendas} vendidos · ★ ${p.avaliacao} · comissão ${(p.comissao*100).toFixed(0)}%</div>
 <div style="margin-top:6px"><span class="nota ${cls}">${p.nota}</span><span class="meta">${esc(p.motivo)}</span></div></div>
 <div class="full"><textarea ${pend?"":"readonly"} aria-label="Legenda">${esc(p.legenda)}</textarea>
 <div class="row"><a class="btn" target="_blank" rel="noopener" href="${esc(p.link_produto||p.link_afiliado)}">Abrir na Shopee</a>
 ${pend?`<label class="btn">Anexar vídeo<input type="file" accept="video/*" hidden data-acao="arquivo"></label><span class="meta" data-st>Nenhum vídeo anexado</span>`:""}
 ${apr&&p.video_url?`<a class="btn" href="${esc(p.video_url)}" download target="_blank">Baixar vídeo</a><button data-acao="copiar">Copiar legenda + link</button><button class="ok" data-acao="publicado">Marcar como publicado</button>`:""}</div>
 ${pend?`<div class="row">${Object.entries(PLAT).map(([k,v])=>`<label><input type="checkbox" value="${k}" >${v}</label>`).join("")}</div>
 <div class="row"><button class="ok" data-acao="aprovar">Aprovar</button><button data-acao="rejeitar">Rejeitar</button><button data-acao="sem_video">Sem vídeo</button></div>`:""}
 </div></article>`}
let dados=[];
async function carregar(){$("#abas").innerHTML=Object.entries(ABAS).map(([k,v])=>`<button data-aba="${k}" class="${k===aba?"on":""}">${v}</button>`).join("");
 $("#msg").textContent="Carregando…";$("#lista").innerHTML="";dados=await api("GET",null,"?status="+aba);
 $("#lista").innerHTML=dados.map(card).join("");$("#msg").textContent=dados.length?"":"Nada aqui. Toque em Coletar agora para buscar produtos."}
document.addEventListener("click",async e=>{const t=e.target,ab=t.dataset.aba;if(ab){aba=ab;return carregar()}
 if(t.id==="coletar"){await fetch("/.netlify/functions/coletar-background",{method:"POST",headers:{"x-senha":senha}});return toast("Coleta iniciada. Atualize em 1 minuto.")}
 if(t.id==="campos"){const r=await api("GET",null,"?campos=1");return toast(r.erro?"Erro: "+r.erro:"Vídeo: "+(r.video.join(", ")||"nenhum campo")+" | Imagens: "+(r.imagens.join(", ")||"nenhum campo")+" | Todos os campos: "+r.campos.join(", "))}
 const el=t.closest(".card"),a=t.dataset.acao;if(!el||!a||a==="arquivo")return;const id=el.dataset.id,p=dados.find(x=>x.id===id);
 if(a==="copiar"){await navigator.clipboard.writeText(p.legenda+"\n\n"+p.link_afiliado);return toast("Legenda e link copiados.")}
 const body={id,acao:a};
 if(a==="aprovar"){body.legenda=el.querySelector("textarea").value;body.video_url=el.dataset.video;body.plataformas=[...el.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
  if(!body.video_url)return toast("Anexe o vídeo antes de aprovar.");if(!body.plataformas.length)return toast("Escolha pelo menos uma plataforma.")}
 t.disabled=true;const r=await api("POST",body);toast(r.erro||r.aviso||"Pronto.");if(!r.erro)carregar();else t.disabled=false});
document.addEventListener("change",async e=>{const f=e.target;if(f.dataset.acao!=="arquivo"||!f.files[0])return;const el=f.closest(".card"),st=el.querySelector("[data-st]"),file=f.files[0];
 st.textContent="Enviando…";try{const u=await api("POST",{id:el.dataset.id,acao:"upload_url",ext:file.name.split(".").pop()});
 const fd=new FormData();fd.append("cacheControl","3600");fd.append("",file);
 const r=await fetch(u.url,{method:"PUT",headers:{"x-upsert":"false"},body:fd});if(!r.ok)throw 0;el.dataset.video=u.publico;st.textContent="Vídeo anexado: "+file.name}catch{st.textContent="Falha no envio. Tente de novo."}});
mostrar();
</script></body></html>
