<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopee-Fila</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#edf0ee}iframe{width:100%;height:100%;border:0}.add-produto-fixed{position:fixed;right:18px;top:18px;z-index:2147483647;border:0;border-radius:10px;padding:11px 16px;font:700 14px Arial,sans-serif;background:#111;color:#fff;cursor:pointer;box-shadow:0 4px 18px #0004}.add-produto-fixed:hover{opacity:.9}</style></head><body><button id="add-produto-fixed" class="add-produto-fixed" type="button">➕ Adicionar produto</button><iframe id="painel" src="/index.html"></iframe><script>
(function(){
 const f=document.getElementById('painel');
 const fixed=document.getElementById('add-produto-fixed');
 const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const senha=()=>f.contentWindow?.localStorage?.senha||'';
 function abrirModal(title,body){const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:#0008;z-index:2147483646;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Arial,sans-serif';m.innerHTML='<div style="width:min(560px,96vw);background:#fff;color:#222;border-radius:14px;padding:18px;box-shadow:0 12px 40px #0005"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">'+title+'</h2><button id="close-modal" type="button">✕</button></div>'+body+'</div>';m.querySelector('#close-modal').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
 async function adicionar(){const m=abrirModal('➕ Adicionar produto','<p style="color:#666">Cole um link da Shopee ou do TikTok Shop.</p><input id="novo-link" placeholder="Cole aqui o link" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px"><div style="margin-top:10px"><button id="importar" type="button" style="padding:10px 14px">🔍 Importar produto</button></div><div id="resultado"></div>');const input=m.querySelector('#novo-link'),btn=m.querySelector('#importar'),res=m.querySelector('#resultado');input.focus();btn.onclick=async()=>{const url=input.value.trim();if(!url){res.innerHTML='<p>Informe o link.</p>';return}btn.disabled=true;btn.textContent='⏳ Importando…';try{const r=await fetch('/.netlify/functions/produto-adicionar',{method:'POST',headers:{'x-senha':senha(),'content-type':'application/json'},body:JSON.stringify({url})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.erro||'Falha ao importar');res.innerHTML='<p style="color:green">✅ '+esc(j.existente?'Produto já cadastrado.':'Produto cadastrado com sucesso.')+'</p><p>'+esc(j.produto?.nome||j.info?.name||'Produto')+'</p><button id="recarregar" type="button">Fechar e atualizar</button>';m.querySelector('#recarregar').onclick=()=>{m.remove();f.contentWindow.location.reload()}}catch(e){res.innerHTML='<p style="color:#b33">❌ '+esc(e.message)+'</p>'}finally{btn.disabled=false;btn.textContent='🔍 Importar produto'}}}
 fixed.onclick=adicionar;
 function run(){try{const d=f.contentDocument;if(!d||!d.body)return;let style=d.getElementById('video-ui-style');if(!style){style=d.createElement('style');style.id='video-ui-style';style.textContent='.produto-box{margin:10px 0;padding:10px;border:1px solid #d3dbd7;border-radius:10px;background:var(--card)}';d.head.appendChild(style)}const coletar=d.getElementById('coletar');if(coletar&&!d.getElementById('adicionar-produto-btn')){const b=d.createElement('button');b.id='adicionar-produto-btn';b.className='pri';b.type='button';b.textContent='➕ Adicionar produto';coletar.parentNode.insertBefore(b,coletar.nextSibling);b.onclick=()=>adicionar()}}catch(e){console.error(e)}}
 f.addEventListener('load',()=>{run();setInterval(run,1000)});setInterval(run,1000);
})();
</script></body></html>
